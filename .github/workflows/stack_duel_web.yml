name: Stack Duel Web (GitHub Pages)

# Builds the Flutter web version and pushes it to the gh-pages branch, so the
# game has a public HTTPS URL — playable in any browser and embeddable as a
# Telegram Mini App, with no Play Store / signing / testing gate.
# One-time owner step: Settings -> Pages -> Source: "Deploy from a branch" ->
# gh-pages / (root).
on:
  push:
    branches:
      - claude/stack-duel-flutter-game-dv0n5r
    paths:
      - "stack_duel/**"
      - ".github/workflows/stack_duel_web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stack_duel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # web/ scaffold is generated (not committed); generic, no customisation yet.
      - name: Generate web scaffold
        run: flutter create --platforms=web --org com.volaura --project-name stack_duel .

      - name: Install dependencies
        run: flutter pub get

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Project pages are served under /LifeSimulator/, so the base href must match.
      - name: Build web
        run: flutter build web --release --base-href /LifeSimulator/ --dart-define=BUILD_TAG=${{ steps.vars.outputs.sha }}-web

      # GitHub Pages does not serve from subfolders with a Jekyll skip; add a
      # .nojekyll so paths starting with _ (Flutter assets) are served as-is.
      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: stack_duel/build/web
          publish_branch: gh-pages
          force_orphan: true
