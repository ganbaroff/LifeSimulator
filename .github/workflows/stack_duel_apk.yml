name: Stack Duel APK

# Builds an installable debug APK in the cloud so it can be sideloaded onto a
# phone without a local Android toolchain. Triggers on pushes that touch the
# game, and can be run on demand from the Actions tab.
on:
  push:
    branches:
      - claude/stack-duel-flutter-game-dv0n5r
    paths:
      - "stack_duel/**"
      - ".github/workflows/stack_duel_apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: stack_duel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze

      # The android/ scaffold is intentionally gitignored, so generate it here.
      # This only adds platform files; it never touches lib/ or pubspec.
      - name: Generate Android scaffold
        run: flutter create --platforms=android .

      # Short commit sha drives BOTH the on-screen build badge and the APK
      # filename, so the download URL is unique per commit (cache-proof) and the
      # player can read the running build on screen.
      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=BUILD_TAG=${{ steps.vars.outputs.sha }}

      - name: Name APK with commit sha
        run: cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/stack-duel-${{ steps.vars.outputs.sha }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stack-duel-${{ steps.vars.outputs.sha }}
          path: stack_duel/build/app/outputs/flutter-apk/stack-duel-${{ steps.vars.outputs.sha }}.apk
          if-no-files-found: error

      # Publish a phone-friendly direct download: a Release asset needs no
      # GitHub login and is not zipped, so it installs straight from the link.
      # Unique per-commit filename defeats client-side download caching.
      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stack-duel-latest
          name: Stack Duel (latest debug build)
          body: "Installable debug APK (unique per commit). The on-screen BUILD tag matches the sha in the filename."
          files: stack_duel/build/app/outputs/flutter-apk/stack-duel-${{ steps.vars.outputs.sha }}.apk
