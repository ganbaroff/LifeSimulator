  <!-- Null-safe Telegram helpers the Dart client calls (Sprint 3): the player's
       name (kills duel "a friend") + native in-chat share via t.me/share. Both
       degrade gracefully when not running inside Telegram. -->
  <script>
    window.sdTgName = function () {
      try {
        var u = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe
          && Telegram.WebApp.initDataUnsafe.user;
        return (u && u.first_name) ? String(u.first_name) : "";
      } catch (e) { return ""; }
    };
    window.sdTgShare = function (url, text) {
      try {
        var w = window.Telegram && Telegram.WebApp;
        var link = "https://t.me/share/url?url=" + encodeURIComponent(url) +
          "&text=" + encodeURIComponent(text);
        if (w && w.openTelegramLink) { w.openTelegramLink(link); return true; }
      } catch (e) {}
      return false;
    };

    // Supabase daily leaderboard (Sprint 4). URL + publishable key are PUBLIC
    // (client-side by design; security is enforced by row-level security).
    // Requires the `stack_scores` table (see stack_duel/supabase/leaderboard.sql).
    window.SUPA_URL = "https://dwdgzfusjsobnixgyzjk.supabase.co";
    window.SUPA_KEY = "sb_publishable_lVUcn3G29V449ltPzCJF4g_ID5G3Ud9";
    window.sdLbSubmit = function (seed, name, score, height) {
      try {
        if (!window.SUPA_URL) return;
        fetch(window.SUPA_URL + "/rest/v1/stack_scores", {
          method: "POST",
          headers: {
            "apikey": window.SUPA_KEY,
            "Authorization": "Bearer " + window.SUPA_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({ seed: seed, name: name, score: score, height: height })
        }).catch(function () {});
      } catch (e) {}
    };
    window.sdLbTop = function (seed) {
      try {
        if (!window.SUPA_URL) return Promise.resolve("[]");
        return fetch(window.SUPA_URL + "/rest/v1/stack_scores?seed=eq." + seed +
          "&order=score.desc&limit=50&select=name,score,height", {
          headers: { "apikey": window.SUPA_KEY, "Authorization": "Bearer " + window.SUPA_KEY }
        }).then(function (r) { return r.text(); }).catch(function () { return "[]"; });
      } catch (e) { return Promise.resolve("[]"); }
    };
  </script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0A0E15; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(#243B55, #0A0E15);
      font-family: -apple-system, Roboto, Arial, sans-serif;
      transition: opacity .35s ease;
    }
    #loading .bars { display: flex; flex-direction: column; align-items: center; }
    #loading .bar { height: 18px; border-radius: 2px; margin: 2px 0; }
    #loading .title {
      color: #fff; font-size: 34px; font-weight: 800; letter-spacing: 2px; margin-top: 22px;
    }
    #loading .sub { color: #7f8c9b; font-size: 14px; margin-top: 14px; }
    #loading .dot { animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  </style>
</head>
<body>
  <div id="loading">
    <div class="bars">
      <div class="bar" style="width:90px;background:#E74C3C"></div>
      <div class="bar" style="width:120px;background:#E67E22;margin-left:22px"></div>
      <div class="bar" style="width:104px;background:#F1C40F"></div>
    </div>
    <div class="title">STACK CITY</div>
    <div class="sub"><span class="dot">●</span> loading</div>
  </div>

  <script>
    try { var t = window.Telegram && window.Telegram.WebApp; if (t) { t.ready(); t.expand(); } } catch (e) {}

    // Deploy-proof: the app is now built with --pwa-strategy=none (no service
    // worker), so deploys are always fresh. But older builds DID register a
    // service worker that pins a client to a stale build (the "ничего не
    // изменилось" / frozen BUILD badge). Kill any leftover worker + its caches
    // and reload ONCE so such clients jump to the latest build. No-op once no
    // worker exists; sessionStorage-guarded so it can never loop.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
          })
          .then(function () {
            if (!sessionStorage.getItem('sw_purged')) {
              sessionStorage.setItem('sw_purged', '1');
              window.location.reload();
            }
          });
      });
    }

    function hideLoading() {
      var l = document.getElementById('loading');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 350); }
    }
    window.addEventListener('flutter-first-frame', hideLoading);
    // Fallback: never let the splash stay stuck over the game.
    setTimeout(hideLoading, 8000);
  </script>
